name: publish-packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.1.13)'
        required: true
        type: string
      feed_smoke:
        description: 'Run QEMU feed smoke after publish (single OpenWrt cell)'
        type: boolean
        default: true
      smoke_version:
        description: 'OpenWrt version for feed smoke (one cell; default 24.10)'
        type: string
        default: '24.10'

env:
  FWLIVE_FEED_BASE_URL: https://lucas-albers-lz4.github.io/fwlive-packages
  FWLIVE_PACKAGES_REPO: lucas-albers-lz4/fwlive-packages
  OWRT_VALIDATE_SSH_WAIT_X86: "600"

permissions:
  contents: read

jobs:
  build-publish:
    runs-on: ubuntu-latest
    # Required reviewers / secret gate — configure Environment "feed-publish" in repo settings.
    environment: feed-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          # R1: do not write GITHUB_TOKEN into .git/config (workspace is bind-mounted into SDK).
          persist-credentials: false

      - name: Resolve release tag
        env:
          TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Reject newlines / control chars before GITHUB_ENV write (R5).
          if [[ "$tag" != "${tag//[$'\n\r']/}" ]]; then
            echo "invalid tag: contains newline" >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "invalid tag '$tag' (expected vN…, e.g. v0.1.34)" >&2
            exit 1
          fi
          echo "FWLIVE_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: $tag"

      - name: Set SOURCE_DATE_EPOCH from release tag
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Validate baseline
        run: ./scripts/validate-baseline.sh

      - name: Write signing keys
        env:
          OPKG_SECRET: ${{ secrets.OPKG_FEED_SECRET_KEY }}
          APK_SECRET: ${{ secrets.APK_FEED_SECRET_KEY }}
          OPKG_PUB: ${{ secrets.OPKG_FEED_PUBLIC_KEY }}
          APK_PUB: ${{ secrets.APK_FEED_PUBLIC_KEY }}
        run: |
          # shellcheck disable=SC2153 # env vars mapped from secrets above
          test -n "$OPKG_SECRET" && test -n "$APK_SECRET"
          # shellcheck source=scripts/lib/feed-keys.sh
          source ./scripts/lib/feed-keys.sh
          feed_keys_write_from_env "$GITHUB_WORKSPACE"

      - name: Validate signing keys
        env:
          OPKG_FEED_SECRET_KEY: ${{ github.workspace }}/opkg-secret.key
          OPKG_FEED_PUBLIC_KEY: ${{ github.workspace }}/public.key
          APK_FEED_SECRET_KEY: ${{ github.workspace }}/apk-secret.rsa
          APK_FEED_PUBLIC_KEY: ${{ github.workspace }}/fwlive-feed.rsa.pub
        run: ./scripts/validate-feed-keys.sh

      # #122: reuse feed clones + dl/ across publishes (lock hash = cache key).
      - name: Cache SDK feeds and dl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .cache/sdk-feeds
          # Exact lock hash only — no restore-keys prefix (avoids stale pins).
          key: sdk-feeds-${{ runner.os }}-${{ hashFiles('scripts/feeds.lock/**') }}

      - name: Restore SDK feeds into docker volumes
        run: ./scripts/ci-cache-sdk-feeds.sh restore .cache/sdk-feeds

      - name: Build packages (21.02, 22.03, 23.05, 24.10, 25.12)
        run: |
          mkdir -p out
          for ver in 21.02 22.03 23.05 24.10 25.12; do
            echo "=== docker-sdk build: OpenWrt ${ver} ==="
            ./scripts/docker-sdk.sh build --target x86-64 --version "$ver"
          done

      - name: Save SDK feeds from docker volumes
        if: always()
        run: ./scripts/ci-cache-sdk-feeds.sh save .cache/sdk-feeds

      - name: Verify reproducible builds
        run: ./scripts/verify-reproducible-build.sh

      - name: Stage signed feed
        env:
          OPKG_FEED_SECRET_KEY: ${{ github.workspace }}/opkg-secret.key
          OPKG_FEED_PUBLIC_KEY: ${{ github.workspace }}/public.key
          APK_FEED_SECRET_KEY: ${{ github.workspace }}/apk-secret.rsa
          APK_FEED_PUBLIC_KEY: ${{ github.workspace }}/fwlive-feed.rsa.pub
          FWLIVE_GIT_TAG: ${{ env.FWLIVE_RELEASE_TAG }}
        run: ./scripts/publish-packages.sh feed-staging

      - name: Deploy to GitHub Pages (fwlive-packages)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          deploy_key: ${{ secrets.FEED_DEPLOY_KEY }}
          external_repository: ${{ env.FWLIVE_PACKAGES_REPO }}
          publish_branch: gh-pages
          publish_dir: feed-staging
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${FWLIVE_RELEASE_TAG}"
          staging="${RUNNER_TEMP}/fwlive-release-assets"
          # shellcheck source=scripts/lib/feed-publish.sh
          source ./scripts/lib/feed-publish.sh
          feed_publish_stage_release_assets "$staging"
          mapfile -t assets < <(find "$staging" -type f | sort)
          if ((${#assets[@]} == 0)); then
            echo "No .ipk/.apk artifacts under out/x86_64/" >&2
            exit 1
          fi
          printf 'Publishing %s release asset(s) for %s\n' "${#assets[@]}" "$tag"
          printf '  %s\n' "${assets[@]##*/}"

          publish_new() {
            gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes
          }

          if gh release view "$tag" >/dev/null 2>&1; then
            immutable="$(gh release view "$tag" --json isImmutable -q '.isImmutable')"
            draft="$(gh release view "$tag" --json isDraft -q '.isDraft')"
            asset_count="$(gh release view "$tag" --json assets -q '.assets | length')"
            if [[ "$immutable" == "true" && "$draft" == "false" ]]; then
              if [[ "$asset_count" -gt 0 ]]; then
                echo "Release $tag already published with ${asset_count} asset(s); skipping upload." >&2
                exit 0
              fi
              echo "Release $tag is published (immutable) with no assets." >&2
              echo "Delete the empty release on GitHub (keep the git tag), then re-run this workflow." >&2
              exit 1
            fi
            if [[ "$asset_count" -eq 0 ]]; then
              echo "Removing empty release $tag before creating with assets..." >&2
              gh release delete "$tag" --yes
              publish_new
            else
              gh release upload "$tag" "${assets[@]}" --clobber
              if [[ "$draft" == "true" ]]; then
                gh release edit "$tag" --draft=false
              fi
            fi
          else
            publish_new
          fi

  # Single-cell QEMU feed smoke (#10): TCG on hosted runners; default OpenWrt 24.10.
  # Tag pushes always smoke; workflow_dispatch can skip via feed_smoke=false.
  smoke-from-feed:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.feed_smoke == 'true'
    needs: build-publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # GitHub-hosted runners expose /dev/kvm but deny KVM init; use TCG for feed smoke.
      OWRT_QEMU_ACCEL: tcg
      OWRT_VALIDATE_SSH_WAIT_X86: "900"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf openssh-client curl

      - name: Wait for GitHub Pages propagation
        run: ./scripts/wait-feed-pages.sh "$FWLIVE_FEED_BASE_URL"

      - name: Feed smoke (single reference cell)
        env:
          FWLIVE_FEED_BASE_URL: ${{ env.FWLIVE_FEED_BASE_URL }}
          SMOKE_VERSION: ${{ github.event.inputs.smoke_version || '24.10' }}
        run: |
          ver="$SMOKE_VERSION"
          echo "Feed smoke OpenWrt version: $ver"
          ./scripts/validate-feed-smoke.sh --version "$ver"
