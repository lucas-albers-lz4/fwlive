name: fwlive-test

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'
      - name: Install shellcheck, busybox, and ruff
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck busybox pipx
          pipx install ruff
          pipx install 'ast-grep-cli==0.45.3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Install real jshn release variants
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libjson-c-dev busybox
          ./scripts/install-host-jshn.sh --all
          bash tests/install-host-jshn.test.sh

      - run: ./scripts/fwlive-test.sh
      - name: Shell parity under busybox sh
        run: SH='busybox sh' node tests/fwlive-shell-filter.test.js
      - name: Link check (internal markdown links + external URLs)
        run: ./scripts/fwlive-linkcheck.sh

  # R9a: inspect real current-version package artifacts, not only the
  # source-shaped host fallback. Keep this job id stable for branch protection;
  # the loop covers both package-manager formats used by supported releases.
  test-ipk-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Build current package artifacts
        run: |
          set -euo pipefail
          source ./scripts/lib/sdk-matrix.sh
          sdk_matrix_reject_symlink_path "$PWD/.ci-sdk-cache" || { echo "cache path must not traverse symlinks" >&2; exit 1; }
          sdk_matrix_reject_symlink_path "$PWD/.ci-sdk-cache/dl" || { echo "cache path must not traverse symlinks" >&2; exit 1; }
          sdk_matrix_reject_symlink_path "$PWD/.ci-sdk-cache/feeds" || { echo "cache path must not traverse symlinks" >&2; exit 1; }
          mkdir -p .ci-sdk-cache/dl
          for version_key in 24.10 25.12; do
            mkdir -p ".ci-sdk-cache/feeds/$(sdk_matrix_version_label "$version_key")"
          done
          sudo chown -R 1000:1000 .ci-sdk-cache
          sudo chmod -R u=rwX,g=rX,o=rX .ci-sdk-cache

          for version_key in 24.10 25.12; do
            version_label="$(sdk_matrix_version_label "$version_key")"
            package_format="$(sdk_matrix_package_format "$version_key")"
            echo "=== docker-sdk build: OpenWrt $version_key ($package_format) ==="
            OWRT_MAKE_JOBS=4 ./scripts/docker-sdk.sh build --target x86-64 --version "$version_key"
          done
      - name: Inspect real package payloads
        run: |
          set -euo pipefail
          source ./scripts/lib/sdk-matrix.sh
          version="$(sed -n 's/^PKG_VERSION:=//p' openwrt-feed/luci-app-fwlive/Makefile)"

          for version_key in 24.10 25.12; do
            version_label="$(sdk_matrix_version_label "$version_key")"
            package_format="$(sdk_matrix_package_format "$version_key")"
            case "$package_format" in
              ipk) pattern="luci-app-fwlive_${version}*.ipk" ;;
              apk) pattern="luci-app-fwlive-${version}*.apk" ;;
              *) echo "unsupported package format: $package_format" >&2; exit 1 ;;
            esac
            package="$(find "$GITHUB_WORKSPACE/out/x86_64/$version_label/fwlive" \
              -type f -name "$pattern" -print | sed -n '1p')"
            test -n "$package"

            payload_dir=""
            if [ "$package_format" = apk ]; then
              payload_dir="$RUNNER_TEMP/fwlive-apk-payload-$version_key"
              mkdir -p "$payload_dir"
              sdk_image="$(sdk_matrix_read_digest_cache x86-64 "$version_key")"
              test -n "$sdk_image"
              docker run --rm \
                --user "$(id -u):$(id -g)" \
                -v "$package:/tmp/fwlive-package.apk:ro" \
                -v "$payload_dir:/payload" \
                "$sdk_image" sh -c \
                'cd /payload && /builder/staging_dir/host/bin/apk --allow-untrusted extract /tmp/fwlive-package.apk'
            fi

            FWLIVE_REQUIRE_PACKAGE=1 \
              FWLIVE_PACKAGE_FORMAT="$package_format" \
              FWLIVE_PACKAGE="$package" \
              FWLIVE_PAYLOAD_DIR="$payload_dir" \
              bash tests/fwlive-package-payload.test.sh
            FWLIVE_REQUIRE_PACKAGE=1 \
              FWLIVE_PACKAGE_FORMAT="$package_format" \
              FWLIVE_PACKAGE="$package" \
              FWLIVE_PAYLOAD_DIR="$payload_dir" \
              bash tests/fwlive-package-lifecycle.test.sh
          done

  # Tier 2 mocked LuCI view smoke — required check (add test-view-mock to branch protection).
  test-view-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mocked view smoke (Tier 2)
        run: npm run test:view

  zizmor:
    runs-on: ubuntu-latest
    env:
      # Digest pins ghcr.io/zizmorcore/zizmor:1.29.0 (multi-arch index).
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284
      ZIZMOR_VERSION: "1.29.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # Static-analysis for Actions (pinned image via docker run, not a
      # job-level container — same EACCES pattern as usrmanage actionlint).
      - name: Verify zizmor version (pinned image)
        run: |
          out="$(docker run --rm "$ZIZMOR_IMAGE" --version)"
          printf '%s\n' "$out"
          expected="zizmor ${ZIZMOR_VERSION}"
          if [[ "$out" != "$expected" ]]; then
            echo "expected '${expected}', got '${out}'" >&2
            exit 1
          fi

      - name: Run zizmor on workflows
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            "$ZIZMOR_IMAGE" \
            --offline --persona=regular --min-severity=high .

  # #290 L6: actionlint (docker run, not job container — usrmanage #85 EACCES).
  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Verify actionlint version (pinned image)
        run: |
          out="$(docker run --rm "$ACTIONLINT_IMAGE" -version)"
          printf '%s\n' "$out"
          # First line is the version token (e.g. "1.7.7"); compare exactly.
          ver="$(printf '%s\n' "$out" | head -n1 | awk '{print $1}')"
          if [[ "$ver" != "$ACTIONLINT_VERSION" ]]; then
            echo "expected actionlint '${ACTIONLINT_VERSION}', got '${ver}'" >&2
            exit 1
          fi
      - name: Run actionlint on workflows
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            "$ACTIONLINT_IMAGE" \
            -color

  # #121: authoritative Z3 suite (F1-F4).
  z3-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "22"
      - name: Install z3-solver (pinned) and busybox
        run: |
          pip install --disable-pip-version-check "z3-solver==5.0.0"
          sudo apt-get update && sudo apt-get install -y busybox
      - name: Z3 verify --full
        run: python3 scripts/z3-verify.py --full
