name: fwlive-test

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'
      - name: Install shellcheck and busybox
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox
      - run: ./scripts/fwlive-test.sh
      - name: Shell parity under busybox sh
        run: SH='busybox sh' node tests/fwlive-shell-filter.test.js
      - name: Link check (internal markdown links + external URLs)
        run: ./scripts/fwlive-linkcheck.sh

  test-view-mock:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mocked view smoke (Tier 2)
        run: npm run test:view

  zizmor:
    runs-on: ubuntu-latest
    env:
      # Digest pins ghcr.io/zizmorcore/zizmor:1.29.0 (multi-arch index).
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284
      ZIZMOR_VERSION: "1.29.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # Static-analysis for Actions (pinned image via docker run, not a
      # job-level container — same EACCES pattern as usrmanage actionlint).
      - name: Verify zizmor version (pinned image)
        run: |
          out="$(docker run --rm "$ZIZMOR_IMAGE" --version)"
          printf '%s\n' "$out"
          expected="zizmor ${ZIZMOR_VERSION}"
          if [[ "$out" != "$expected" ]]; then
            echo "expected '${expected}', got '${out}'" >&2
            exit 1
          fi

      - name: Run zizmor on workflows
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            "$ZIZMOR_IMAGE" \
            --offline --persona=regular --min-severity=high .

  # #121: authoritative Z3 suite (F1-F4).
  z3-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "22"
      - name: Install z3-solver (pinned) and busybox
        run: |
          pip install --disable-pip-version-check "z3-solver==5.0.0"
          sudo apt-get update && sudo apt-get install -y busybox
      - name: Z3 verify --full
        run: python3 scripts/z3-verify.py --full
