# Optional overlay: bind-mount an extracted SDK from the host.
# Only use when the host path is on a case-sensitive filesystem (typical Linux).
#
#   export OPENWRT_SDK_MOUNT=/path/to/openwrt-sdk-...
#   docker compose -f docker-compose.yml -f docker-compose.bind.yml run --rm sdk-bind make package/luci-app-fwlive/compile V=s
#
# Build / pull the image first: docker compose build sdk

services:
  sdk-bind:
    image: fwlive-openwrt-sdk:24.10
    platform: linux/amd64
    working_dir: /openwrt-sdk
    volumes:
      - ${OPENWRT_SDK_MOUNT:?Set OPENWRT_SDK_MOUNT to the extracted SDK root}:/openwrt-sdk
      - ${FWLIVE_MOUNT:-.}:/work/fwlive:ro
    stdin_open: true
    tty: true
