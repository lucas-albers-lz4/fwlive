# OpenWrt package builds on Linux x86_64 only.
#
# Recommended: ./scripts/docker-sdk.sh (ghcr.io/openwrt/sdk matrix) — docs/sdk-build-matrix.md
# Default cell: armsr-armv8 + snapshot (service sdk-official alias)
#
# Optional profiles (avoid port 8080/2222 conflicts with QEMU):
#   docker compose --profile experimental up -d rootfs-x86
#   docker compose --profile legacy run --rm sdk-legacy   # archived path — see archive/

volumes:
  # armsr-armv8 × snapshot (legacy default; same as OWRT_SDK_* unset)
  openwrt_sdk_official:
  openwrt_sdk_armsr_armv8_25_12_0:
  openwrt_sdk_armsr_armv8_24_10_5:
  openwrt_sdk_armsr_armv8_23_05_5:
  openwrt_sdk_x86_64_snapshot:
  openwrt_sdk_x86_64_25_12_0:
  openwrt_sdk_x86_64_24_10_5:
  openwrt_sdk_x86_64_23_05_5:
  openwrt_sdk:

services:
  # Experimental LuCI in browser — docs/openwrt-rootfs-x86-docker.md (not for nft log QA)
  rootfs-x86:
    profiles: ["experimental"]
    image: ghcr.io/openwrt/rootfs:x86-64
    platform: linux/amd64
    container_name: owrt-x64-exp
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8080:80"
      - "8443:443"
      - "2222:22"
    command: ["/sbin/init"]
    restart: unless-stopped

  # Parameterized SDK (set OWRT_SDK_IMAGE + OWRT_SDK_VOLUME via scripts/docker-sdk.sh)
  sdk:
    image: ${OWRT_SDK_IMAGE:-ghcr.io/openwrt/sdk:armsr-armv8}
    platform: linux/amd64
    working_dir: /builder
    volumes:
      - ${OWRT_SDK_VOLUME:-openwrt_sdk_official}:/builder
      - ${FWLIVE_MOUNT:-.}:/work/fwlive:ro
    stdin_open: true
    tty: true

  # Backward-compatible alias (armsr-armv8 snapshot)
  sdk-official:
    image: ghcr.io/openwrt/sdk:armsr-armv8
    platform: linux/amd64
    working_dir: /builder
    volumes:
      - openwrt_sdk_official:/builder
      - ${FWLIVE_MOUNT:-.}:/work/fwlive:ro
    stdin_open: true
    tty: true

  # Archived: fwlive-built SDK + tarball import — see archive/scripts/
  sdk-legacy:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: build/openwrt-sdk.Dockerfile
    image: fwlive-openwrt-sdk:24.10
    platform: linux/amd64
    working_dir: /openwrt-sdk
    volumes:
      - openwrt_sdk:/openwrt-sdk
      - ${FWLIVE_MOUNT:-.}:/work/fwlive:ro
    stdin_open: true
    tty: true
